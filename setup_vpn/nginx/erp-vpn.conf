# =============================================================================
# Nginx reverse proxy for TijaeroERP – accessible only via OpenVPN
# VPN clients reach this via http://10.8.0.1  (VPS VPN interface)
# =============================================================================

# Upstream services (Docker container names / host ports)
upstream erp_frontend {
    server frontend:80;
}

upstream erp_backend {
    server backend:8000;
}

upstream erp_adminer {
    server adminer:8080;
}

upstream erp_pgadmin {
    server pgadmin:80;
}

# ── Main ERP server ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;   # Matches any hostname / direct IP access

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── API (backend) ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://erp_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # WebSocket support (if used)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── FastAPI auto-generated docs ────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass       http://erp_backend;
        proxy_set_header Host $host;
    }

    # ── Frontend (catch-all – must be last) ───────────────────────────────────
    location / {
        proxy_pass         http://erp_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR (dev) / SockJS
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ── Adminer – database management (port 8080 on VPN) ─────────────────────────
server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass       http://erp_adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── pgAdmin – PostgreSQL admin UI (port 5050 on VPN) ─────────────────────────
server {
    listen 5050;
    server_name _;

    location / {
        proxy_pass       http://erp_pgadmin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name     "";
    }
}

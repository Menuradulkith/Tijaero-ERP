[tool.poetry]
name = "erp-backend"
version = "1.0.0"
description = "ERP System Backend API"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
pydantic = {extras = ["email"], version = "^2.10.0"}
pydantic-settings = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = "^1.7.4"
bcrypt = "^4.0.0"
python-multipart = "^0.0.6"
psycopg = {extras = ["binary"], version = "^3.1.0"}
email-validator = "^2.0.0"
python-dateutil = "^2.9.0.post0"
jinja2 = "^3.1.0"
gunicorn = "^21.2.0"
orjson = "^3.9.0"
weasyprint = "^61.2"
pydyf = ">=0.10.0,<0.11"
playwright = "^1.42.0"
openai = "^2.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.10.0"
flake8 = "^6.1.0"
mypy = "^1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

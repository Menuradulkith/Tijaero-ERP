# =============================================================================
# Nginx reverse proxy for TijaeroERP – accessible only via OpenVPN
# Single port 80 serves everything – no port conflicts with Docker base compose.
# =============================================================================

upstream erp_frontend {
    server frontend:80;
}

upstream erp_backend {
    server backend:8000;
}

upstream erp_adminer {
    server adminer:8080;
}

upstream erp_pgadmin {
    server pgadmin:80;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── API (backend) ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://erp_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── FastAPI docs ───────────────────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass       http://erp_backend;
        proxy_set_header Host $host;
    }

    # ── Adminer at /adminer/ ───────────────────────────────────────────────────
    # Trailing slash on proxy_pass strips the /adminer prefix before forwarding
    location /adminer/ {
        proxy_pass         http://erp_adminer/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── pgAdmin at /pgadmin/ ───────────────────────────────────────────────────
    # pgAdmin reads APPLICATION_ROOT='/pgadmin' from env (docker-compose.server.yml)
    location /pgadmin/ {
        proxy_pass         http://erp_pgadmin/pgadmin/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Script-Name     /pgadmin;
        proxy_redirect     off;
    }

    # ── Frontend (catch-all – must be last) ───────────────────────────────────
    location / {
        proxy_pass         http://erp_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

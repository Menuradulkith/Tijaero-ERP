services:
  # Backend API - Server Overrides
  backend:
    restart: always
    ports: []   # nginx proxies /api/ – no direct host port needed
    environment:
      # Frontend and backend share the same origin (10.8.0.1:80) via nginx,
      # so CORS is same-origin. Still set it explicitly for correctness.
      BACKEND_CORS_ORIGINS: '["http://${VPN_GATEWAY_IP:-10.8.0.1}"]'
    command: >
      sh -c "
        echo 'Checking for migrations...' &&
        if alembic current 2>&1 | grep -q 'Multiple head'; then
          echo 'Multiple migration heads detected. Please fix migrations manually.' &&
          exit 1
        fi &&
        alembic upgrade head &&
        echo 'Initializing permissions and groups...' &&
        python scripts/init_permissions.py &&
        echo 'Ensuring admin user exists...' &&
        python scripts/ensure_admin.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    # Remove --reload for production
    volumes: []
    # Remove volume mount for production (optional - for security)

  # Frontend - Server Overrides
  frontend:
    restart: always
    ports: []   # nginx proxies / – no direct host port needed
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser calls go: browser → VPN → 10.8.0.1 (nginx) → /api/ → backend
        # Must point to nginx, NOT the backend container port directly.
        # VPN_GATEWAY_IP is exported by docker-server-up.sh from vpn.env.
        VITE_API_URL: http://${VPN_GATEWAY_IP:-10.8.0.1}/api/v1

  # Database - Server Settings
  postgres:
    restart: always

  # Adminer - Server Settings
  adminer:
    restart: always
    ports: []   # nginx proxies :8080 – no direct host port needed

  # pgAdmin - Server Settings
  pgadmin:
    restart: always
    ports: []   # nginx proxies at /pgadmin/ on port 80 – no direct host port needed
    environment:
      PGADMIN_CONFIG_APPLICATION_ROOT: "'/pgadmin'"

  # ── Nginx Reverse Proxy – accessible only via OpenVPN ───────────────────────
  # Single port 80 serves everything. Adminer at /adminer/, pgAdmin at /pgadmin/.
  # Security enforced by UFW: port 80 is allowed only from tun0 (VPN interface).
  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: always
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./setup_vpn/nginx/erp-vpn.conf:/etc/nginx/conf.d/erp-vpn.conf:ro
    networks:
      - erp_network
    depends_on:
      - frontend
      - backend
      - adminer
      - pgadmin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

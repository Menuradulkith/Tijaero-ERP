services:
  # Backend API - Server Overrides
  backend:
    restart: always
    environment:
      # Override CORS for production
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    command: >
      sh -c "
        echo 'Checking for migrations...' &&
        if alembic current 2>&1 | grep -q 'Multiple head'; then
          echo 'Multiple migration heads detected. Please fix migrations manually.' &&
          exit 1
        fi &&
        alembic upgrade head &&
        echo 'Initializing permissions and groups...' &&
        python scripts/init_permissions.py &&
        echo 'Ensuring admin user exists...' &&
        python scripts/ensure_admin.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    # Remove --reload for production
    volumes: []
    # Remove volume mount for production (optional - for security)

  # Frontend - Server Overrides  
  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

  # Database - Server Settings
  postgres:
    restart: always

  # Adminer - Server Settings
  adminer:
    restart: always

  # pgAdmin - Server Settings
  pgadmin:
    restart: always

  # ── Nginx Reverse Proxy – accessible only via OpenVPN (10.8.0.1) ────────────
  # Consolidates frontend (:80), backend (:8000), adminer (:8080), pgadmin (:5050)
  # behind a single entry point. Bind only to the VPN interface (10.8.0.1)
  # so the services are NOT reachable from the public internet.
  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: always
    # Bind to VPN interface only (set to 0.0.0.0 + UFW rules if tun0 isn't ready
    # before docker compose starts, which is the common case on first boot)
    ports:
      - "${VPN_GATEWAY_IP:-10.8.0.1}:80:80"
      - "${VPN_GATEWAY_IP:-10.8.0.1}:8080:8080"
      - "${VPN_GATEWAY_IP:-10.8.0.1}:5050:5050"
    volumes:
      - ./setup_vpn/nginx/erp-vpn.conf:/etc/nginx/conf.d/erp-vpn.conf:ro
    networks:
      - erp_network
    depends_on:
      - frontend
      - backend
      - adminer
      - pgadmin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

services:
  # Backend API - Server Overrides
  backend:
    restart: always
    ports: []   # nginx proxies /api/ – no direct host port needed
    environment:
      # Override CORS for production
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    command: >
      sh -c "
        echo 'Checking for migrations...' &&
        if alembic current 2>&1 | grep -q 'Multiple head'; then
          echo 'Multiple migration heads detected. Please fix migrations manually.' &&
          exit 1
        fi &&
        alembic upgrade head &&
        echo 'Initializing permissions and groups...' &&
        python scripts/init_permissions.py &&
        echo 'Ensuring admin user exists...' &&
        python scripts/ensure_admin.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    # Remove --reload for production
    volumes: []
    # Remove volume mount for production (optional - for security)

  # Frontend - Server Overrides
  frontend:
    restart: always
    ports: []   # nginx proxies / – no direct host port needed
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

  # Database - Server Settings
  postgres:
    restart: always

  # Adminer - Server Settings
  adminer:
    restart: always
    ports: []   # nginx proxies :8080 – no direct host port needed

  # pgAdmin - Server Settings
  pgadmin:
    restart: always
    ports: []   # nginx proxies :5050 – no direct host port needed

  # ── Nginx Reverse Proxy – accessible only via OpenVPN ───────────────────────
  # Binds to 0.0.0.0 so Docker doesn't depend on tun0 being up at compose start.
  # Security is enforced by UFW: ports 80/8080/5050 are allowed only from tun0
  # (see setup_vpn/setup-openvpn.sh) so they remain unreachable from the internet.
  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:5050:5050"
    volumes:
      - ./setup_vpn/nginx/erp-vpn.conf:/etc/nginx/conf.d/erp-vpn.conf:ro
    networks:
      - erp_network
    depends_on:
      - frontend
      - backend
      - adminer
      - pgadmin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
